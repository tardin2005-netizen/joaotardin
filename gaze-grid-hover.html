<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaze Grid Hover — João Tardin</title>
<style>
  :root{
    --bg:#04070f;
    --surface:#0d1526;
    --border:#1e2c4d;
    --text:#eef2fb;
    --text-dim:#8b96ba;
    --accent:#3d7bff;
    --font-display:'Sora', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body), sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
    padding:40px 20px;
  }
  h1{font-family:var(--font-display), sans-serif; font-size:clamp(22px,4vw,32px); text-align:center;}
  p.hint{color:var(--text-dim); font-size:14px; text-align:center; max-width:46ch; font-family:var(--font-mono), monospace;}

  .gaze-wrap{
    position:relative;
    width:min(420px, 88vw);
    aspect-ratio:1/1;
    border-radius:24px;
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--surface);
    box-shadow:0 30px 80px -30px rgba(61,123,255,.35);
  }
  .gaze-wrap img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity .05s linear;
  }
  .gaze-wrap img.active{ opacity:1; }

  .gaze-grid{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    z-index:5;
  }
  .gaze-cell{ cursor:default; }
  /* uncomment to debug hit zones
  .gaze-cell{ outline:1px dashed rgba(255,255,255,.15); }
  */

  .fallback-note{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    font-size:13px;
    color:var(--text-dim);
    font-family:var(--font-mono), monospace;
    background:var(--surface);
    z-index:1;
  }
</style>
</head>
<body>

  <h1>Gaze Grid <span style="color:var(--accent)">Hover</span></h1>
  <p class="hint">Mova o mouse sobre a foto — os olhos acompanham a direção do cursor.</p>

  <div class="gaze-wrap" id="gazeWrap">
    <div class="fallback-note" id="fallbackNote">
      Gere as 9 imagens (assets/gaze/gaze-1.jpg … gaze-9.jpg) para ativar o efeito.
    </div>
    <img data-key="1" src="assets/gaze/gaze-1.jpg" alt="Olhar para cima-esquerda">
    <img data-key="2" src="assets/gaze/gaze-2.jpg" alt="Olhar para cima">
    <img data-key="3" src="assets/gaze/gaze-3.jpg" alt="Olhar para cima-direita">
    <img data-key="4" src="assets/gaze/gaze-4.jpg" alt="Olhar para esquerda">
    <img data-key="5" class="active" src="assets/gaze/gaze-5.jpg" alt="Olhar para frente">
    <img data-key="6" src="assets/gaze/gaze-6.jpg" alt="Olhar para direita">
    <img data-key="7" src="assets/gaze/gaze-7.jpg" alt="Olhar para baixo-esquerda">
    <img data-key="8" src="assets/gaze/gaze-8.jpg" alt="Olhar para baixo">
    <img data-key="9" src="assets/gaze/gaze-9.jpg" alt="Olhar para baixo-direita">

    <div class="gaze-grid" id="gazeGrid">
      <div class="gaze-cell" data-key="1"></div>
      <div class="gaze-cell" data-key="2"></div>
      <div class="gaze-cell" data-key="3"></div>
      <div class="gaze-cell" data-key="4"></div>
      <div class="gaze-cell" data-key="5"></div>
      <div class="gaze-cell" data-key="6"></div>
      <div class="gaze-cell" data-key="7"></div>
      <div class="gaze-cell" data-key="8"></div>
      <div class="gaze-cell" data-key="9"></div>
    </div>
  </div>

  <p class="hint" id="statusHint"></p>

<script>
  const wrap = document.getElementById('gazeWrap');
  const images = Array.from(wrap.querySelectorAll('img'));
  const cells = Array.from(document.querySelectorAll('.gaze-cell'));
  const fallbackNote = document.getElementById('fallbackNote');
  const statusHint = document.getElementById('statusHint');

  let loadedCount = 0;
  let anyFailed = false;

  images.forEach(img=>{
    if(img.complete && img.naturalWidth > 0){
      loadedCount++;
    } else {
      img.addEventListener('load', ()=>{ loadedCount++; checkReady(); });
      img.addEventListener('error', ()=>{ anyFailed = true; checkReady(); });
    }
  });

  function checkReady(){
    if(loadedCount === images.length){
      fallbackNote.style.display = 'none';
      statusHint.textContent = '9 imagens carregadas — efeito ativo.';
    } else if(anyFailed){
      statusHint.textContent = 'Faltam imagens em assets/gaze/. O efeito ainda não está ativo.';
    }
  }
  checkReady();

  function setGaze(key){
    images.forEach(img=> img.classList.toggle('active', img.dataset.key === key));
  }

  cells.forEach(cell=>{
    cell.addEventListener('mouseenter', ()=> setGaze(cell.dataset.key));
  });
  wrap.addEventListener('mouseleave', ()=> setGaze('5'));
</script>
</body>
</html>
